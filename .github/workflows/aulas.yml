name: Conferir exemplos e publicar aulas na Wiki

on:
  push:
    branches: [main]
    paths:
      - 'wiki/**'
      - 'exemplos/**'
      - '.github/workflows/aulas.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aulas-wiki
  cancel-in-progress: false

jobs:
  exemplos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compilar cada projeto Maven isoladamente
        shell: bash
        run: |
          set -euo pipefail
          for pom in exemplos/maven/*/pom.xml; do
            mvn --batch-mode --no-transfer-progress -f "$pom" clean package
          done
      - name: Conferir a leitura, a persistência e os percentuais
        shell: bash
        run: |
          set -euo pipefail
          cd exemplos/maven/03-excecoes
          mvn -q exec:java | grep -F 'Número lido: 07'
          cd ../04-persistencia
          mvn -q exec:java "-Dexec.args=gravar"
          mvn -q exec:java | grep -F 'No arquivo: Júlia Horizonte'
          cd ../07-apuracao
          mvn -q exec:java | grep -F '07 | 2 | 50,0%'
  wiki:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Atualizar as páginas das aulas
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pasta="$RUNNER_TEMP/wiki-da-disciplina"
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth"
          git clone --quiet "https://github.com/${GITHUB_REPOSITORY}.wiki.git" "$pasta"
          cp wiki/*.md "$pasta/"
          git -C "$pasta" add -- '*.md'
          if ! git -C "$pasta" diff --cached --quiet; then
            git -C "$pasta" -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "Atualiza aulas de POO a partir de ${GITHUB_SHA:0:7}"
            git -C "$pasta" push origin HEAD
          fi
          git -C "$pasta" fetch origin
          test "$(git -C "$pasta" rev-parse HEAD)" = "$(git -C "$pasta" rev-parse '@{u}')"
          for f in wiki/*.md; do cmp "$f" "$pasta/${f#wiki/}"; done
